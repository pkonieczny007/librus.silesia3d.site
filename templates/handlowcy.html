<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarządzanie Handlowcami</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .back-button {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background: #f5f5f5;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .add-row-btn, .save-btn {
            padding: 12px 24px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .add-row-btn:hover, .save-btn:hover {
            background: #218838;
        }

        .delete-btn {
            padding: 6px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👥 Zarządzanie Handlowcami</h1>

        <a href="/" class="back-button">← Powrót do generatora</a>

        <div id="message" class="message"></div>

        <table id="handlowcyTable">
            <thead>
                <tr>
                    <th>Grupa zajęciowa</th>
                    <th>Handlowiec</th>
                    <th>Akcje</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Dane będą załadowane przez JavaScript -->
            </tbody>
        </table>

        <button class="add-row-btn" onclick="addRow()">➕ Dodaj wiersz</button>
        <button class="save-btn" onclick="saveData()">💾 Zapisz zmiany</button>
    </div>

    <script>
        let handlowcyData = [];

        async function loadData() {
            try {
                const response = await fetch('/get_handlowcy');
                handlowcyData = await response.json();
                renderTable();
            } catch (error) {
                showMessage('Błąd wczytywania danych: ' + error.message, 'error');
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            handlowcyData.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="text" value="${row['Grupa zajęciowa'] || ''}" 
                        onchange="updateData(${index}, 'Grupa zajęciowa', this.value)"></td>
                    <td><input type="text" value="${row['Handlowiec'] || ''}" 
                        onchange="updateData(${index}, 'Handlowiec', this.value)"></td>
                    <td><button class="delete-btn" onclick="deleteRow(${index})">🗑️ Usuń</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateData(index, field, value) {
            handlowcyData[index][field] = value;
        }

        function addRow() {
            handlowcyData.push({
                'Grupa zajęciowa': '',
                'Handlowiec': ''
            });
            renderTable();
        }

        function deleteRow(index) {
            if (confirm('Czy na pewno chcesz usunąć ten wiersz?')) {
                handlowcyData.splice(index, 1);
                renderTable();
            }
        }

        async function saveData() {
            try {
                const response = await fetch('/update_handlowcy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(handlowcyData)
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('✅ Dane zostały zapisane pomyślnie!', 'success');
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                showMessage('❌ Błąd zapisu: ' + error.message, 'error');
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';

            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        // Załaduj dane przy starcie
        loadData();
    </script>
</body>
</html>
